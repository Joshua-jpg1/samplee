<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #eef2ff);
      color: #1e293b;
    }
    .card {
      width: min(100%, 460px);
      padding: 42px 30px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, .10);
    }
    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
    }
    h1 { margin-bottom: 12px; color: #1e3a8a; font-size: 32px; }
    p { margin-bottom: 24px; color: #64748b; line-height: 1.6; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 23px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    #clock { margin-top: 24px; color: #334155; font-size: 14px; }
    footer { margin-top: 28px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">MY FIRST WEBSITE</span>
    <h1>Welcome!</h1>
    <p>This is a simple sample website built with HTML, CSS, and JavaScript.</p>
    <button type="button" id="messageButton">Click Me</button>
    <div id="clock" aria-live="polite"></div>
    <footer>Made with HTML, CSS &amp; JavaScript</footer>
  </main>

  <script>
    document.getElementById("messageButton").addEventListener("click", function () {
      alert("Congratulations! Your website is working!");
    });

    function updateClock() {
      document.getElementById("clock").textContent =
        "Date & Time: " + new Date().toLocaleString();
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
